groups:
- neurodata_type_def: BrainstemTable
  neurodata_type_inc: DynamicTable
  doc: BrainSTEM records of one kind (procedures, materials, interfaces, ...), 
    one row per record. Besides the required columns, a table has one column per
    BrainSTEM field of its records, named as the field. Text columns hold 
    strings as stored and other values (numbers, booleans, JSON objects such as 
    a record's typed details) as JSON; an empty string means no value. A field 
    that links to records in another BrainstemTable (or to the NWB epochs table)
    is a ragged DynamicTableRegion with the same name; links to records not in 
    the file are listed in the 'unresolved_links' column.
  attributes:
  - name: brainstem_models
    dtype: text
    dims:
    - dim_0
    shape:
    - null
    doc: BrainSTEM model labels of the rows, e.g. 'modules.procedure'.
  datasets:
  - name: brainstem_id
    neurodata_type_inc: VectorData
    dtype: text
    doc: BrainSTEM id of the record (a UUID; user ids are integers written as 
      text).
  - name: brainstem_model
    neurodata_type_inc: VectorData
    dtype: text
    doc: BrainSTEM model label of the record, e.g. 'modules.procedure'.
  - name: details_schema
    neurodata_type_inc: VectorData
    dtype: text
    doc: BrainSTEM JSON schema of the record's typed details, as 
      '<Family>/<Type>@<version>' (e.g. 'Procedure/VirusInjection@3.0.0'); 
      '<Family>/<Type>' when the record stores no version; empty when the record
      has no typed details. The 'schemas' table gives its URL (and the schema, 
      when embedded).
    quantity: '?'
  - name: coordinates_schema
    neurodata_type_inc: VectorData
    dtype: text
    doc: BrainSTEM JSON schema of the record's coordinates, as for 
      details_schema (family 'Coordinates').
    quantity: '?'
  - name: unresolved_links
    neurodata_type_inc: VectorData
    dtype: text
    doc: 'JSON object {field: [BrainSTEM ids]} of links to records that are not in
      this file.'
    quantity: '?'
- neurodata_type_def: BrainstemSchemaTable
  neurodata_type_inc: DynamicTable
  doc: "The BrainSTEM JSON schemas that the tables' schema columns (details_schema,
    coordinates_schema) name: their stable URL and, when embedded, the schema itself.
    Published BrainSTEM schema versions never change, so the URL can be cited."
  datasets:
  - name: schema_id
    neurodata_type_inc: VectorData
    dtype: text
    doc: "'<Family>/<Type>@<version>', or '<Family>/<Type>' for records that store
      no version."
  - name: schema_url
    neurodata_type_inc: VectorData
    dtype: text
    doc: Stable URL of the schema version, e.g. 
      https://www.brainstem.org/schemas/Procedure/VirusInjection/3.0.0.json; for
      an id without a version, the URL listing the type's versions.
  - name: schema_json
    neurodata_type_inc: VectorData
    dtype: text
    doc: The JSON schema (draft 7) as JSON text; empty when it was not embedded.
- neurodata_type_def: BrainstemMetadata
  neurodata_type_inc: LabMetaData
  default_name: brainstem
  doc: 'The BrainSTEM metadata of this file: where it was exported from, and the BrainSTEM
    records it was made from as BrainstemTables. Written by brainstem-nwb.'
  attributes:
  - name: export_format_version
    dtype: text
    doc: Version of the BrainSTEM export the file was made from, e.g. '2.1'.
  - name: export_scope
    dtype: text
    doc: "'project' or 'session'."
  - name: exported_at
    dtype: text
    doc: When the BrainSTEM export was made (ISO 8601).
  - name: source_sha256
    dtype: text
    doc: sha256 of the BrainSTEM export.
  - name: project_ids
    dtype: text
    dims:
    - dim_0
    shape:
    - null
    doc: BrainSTEM ids of the projects the session belongs to.
  - name: session_id
    dtype: text
    doc: BrainSTEM id of the session.
  - name: subject_id
    dtype: text
    doc: BrainSTEM id of the subject (absent for files without a subject).
    required: false
  - name: unit_id
    dtype: text
    doc: "brainstem-nwb unit id: '<session id>__<subject id>'."
  - name: exporter
    dtype: text
    doc: Software that wrote the metadata (brainstem-nwb).
  - name: exporter_version
    dtype: text
    doc: Version of the exporter.
  - name: mapping_version
    dtype: text
    doc: Version of the exporter's BrainSTEM-to-NWB mapping.
  - name: content_sha256
    dtype: text
    doc: Digest of the planned NWB content; the NWB identifier is derived from 
      it.
  groups:
  - neurodata_type_inc: BrainstemTable
    doc: One table per kind of BrainSTEM record (procedures, materials, 
      interfaces, ...).
    quantity: '*'
  - name: schemas
    neurodata_type_inc: BrainstemSchemaTable
    doc: BrainSTEM JSON schemas named by the tables.
    quantity: '?'
